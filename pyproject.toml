[project]

name = "document-vectorizer" # Edit this and remove comment
version = "1.0.0"

requires-python = ">=3.10"
dependencies = [
    "common-code[test] @ git+https://github.com/swiss-ai-center/common-code.git@main",
    "langchain==0.1.13",
    "pypdf==4.1.0",
    "sentence-transformers==2.6.1",
